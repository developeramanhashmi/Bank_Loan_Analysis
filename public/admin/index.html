<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest House — Booking Admin</title><link rel="stylesheet" href="/theme.css"><script src="https://cdn.tailwindcss.com"></script></head><body style="padding:35px"><div class="shell"><div style="display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px"><div><p class="eyebrow">PRIVATE ADMIN</p><h1 style="font:400 42px Georgia,serif;margin:0">Booking Requests</h1></div><a class="btn btn-dark" href="/">View Website</a></div><div id="admin-status" style="color:#69726c;font-size:13px">Loading…</div><div id="bookings" style="margin-top:20px"></div></div><script>async function load(){const s=document.getElementById('admin-status'),box=document.getElementById('bookings');try{const r=await fetch('/api/admin/bookings',{redirect:'manual'});if(r.status===401||r.type==='opaqueredirect'){window.location='https://hatchable.com/console/login';return}if(r.status===403){s.textContent='Admin access required.';return}const rows=await r.json();s.textContent=rows.length+' booking request(s)';box.innerHTML=rows.length?rows.map(x=>`<article style="background:#fff;border:1px solid #dedbd3;padding:20px;margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:20px"><div><strong>${esc(x.guest_name)}</strong><div style="font-size:12px;color:#69726c">${esc(x.room_type)} · ${x.number_of_rooms} room(s) · ${x.total_guests} guest(s)</div></div><select onchange="updateStatus('${x.id}',this.value)"><option ${x.status==='New'?'selected':''}>New</option><option ${x.status==='Contacted'?'selected':''}>Contacted</option><option ${x.status==='Confirmed'?'selected':''}>Confirmed</option><option ${x.status==='Cancelled'?'selected':''}>Cancelled</option></select></div><p style="font-size:13px">${esc(x.check_in_date)} → ${esc(x.check_out_date)} · ${esc(x.contact_number)}</p><p style="font-size:13px;color:#69726c">${esc(x.address)}</p><p style="font-size:13px">${esc(x.additional_requirements||'No additional requirements.')}</p><button onclick="removeBooking('${x.id}')" style="border:0;background:none;color:#a33;font-size:11px;cursor:pointer">Delete request</button></article>`).join(''):'<div style="padding:30px;background:#fff;border:1px solid #dedbd3">No booking requests yet.</div>'}catch(e){s.textContent='Unable to load booking requests.'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function updateStatus(id,status){await fetch('/api/admin/bookings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});load()}async function removeBooking(id){if(confirm('Delete this request?')){await fetch('/api/admin/bookings',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});load()}}load();</script></body></html>
